name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite'

jobs:
  build:
    name: windows-x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: .cache/vcpkg
          key: vcpkg-windows-2022-x64-windows-${{ hashFiles('vcpkg.json', '.github/workflows/build.yml') }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify runner Ninja (Windows)
        shell: pwsh
        run: ninja --version

      - name: Install pkg-config (Windows)
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          pkg-config --version

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          BASELINE=$(awk -F'"' '/builtin-baseline/ {print $4}' vcpkg.json)
          if [ "$BASELINE" = "REPLACE_WITH_VCPKG_COMMIT_HASH" ]; then
            echo "::error::vcpkg.json builtin-baseline is unset. Pin it to a real vcpkg commit hash."
            exit 1
          fi
          if [ ! -d "$HOME/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          fi
          git -C "$HOME/vcpkg" fetch --depth=1 origin "$BASELINE"
          git -C "$HOME/vcpkg" checkout "$BASELINE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$HOME/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          MANIFEST_FEATURES="gui"
          mkdir -p .cache/vcpkg
          VCPKG_FEATURE_ARGS=()
          if [ -n "$MANIFEST_FEATURES" ]; then
            VCPKG_FEATURE_ARGS+=(--x-feature="$MANIFEST_FEATURES")
          fi
          "$VCPKG_ROOT/vcpkg" install --triplet=x64-windows \
            --x-install-root="$PWD/build/vcpkg_installed" "${VCPKG_FEATURE_ARGS[@]}"
          QT_TOOLS="$PWD/build/vcpkg_installed/x64-windows/tools/Qt6/bin"
          test -x "$QT_TOOLS/lrelease.exe"
          test -x "$QT_TOOLS/lconvert.exe"
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_MANIFEST_FEATURES="$MANIFEST_FEATURES" \
            -DMEDIA_STORAGE_STATIC_BINARIES=OFF \
            -DBUILD_GUI=ON \
            -DBUILD_TESTS=OFF

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      # Exercise the production x64 architecture without a desktop session.
      - name: Windows x64 GUI smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$PWD/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$PWD/build/vcpkg_installed/x64-windows/Qt6/plugins"
          $process = Start-Process -FilePath "$PWD/build/media_storage_gui.exe" -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'GUI smoke timed out'
          }
          if ($process.ExitCode -ne 0) { throw "GUI smoke failed: $($process.ExitCode)" }

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Raw CI outputs; packaging is a separate task.
          cp build/*.dll dist/
          cp build/media_storage.exe dist/media_storage-windows-x64.exe
          cp build/media_storage_gui.exe dist/media_storage_gui-windows-x64.exe
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Reliquary-windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -la artifacts/

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          TAG="${GITHUB_REF#refs/tags/}"
          NAME="Reliquary $TAG - $COMMIT_SUBJECT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "name<<META_EOF"
            echo "$NAME"
            echo "META_EOF"
            echo "body<<META_EOF"
            echo "Automated build from commit \`$SHORT_SHA\` (${GITHUB_SHA})."
            echo ""
            echo "**$COMMIT_SUBJECT**"
            if [ -n "$COMMIT_BODY" ]; then
              echo ""
              echo "$COMMIT_BODY"
            fi
            echo "META_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
